[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homebrew-news"
version = "0.0.0"
description = "A Hermes plugin and CLI for daily news from Homebrew tap history"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["stamina>=24.3,<27"]

[project.scripts]
homebrew-news = "homebrew_news.cli:run_cli"

[project.entry-points."hermes_agent.plugins"]
homebrew-news = "homebrew_news.hermes_plugin:register"

[dependency-groups]
dev = [
    "ai-rulez==4.24.2",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-xdist>=3",
    "pyyaml>=6",
    "ruff>=0.8",
    "types-pyyaml>=6",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "EM", "TRY003", "COM812", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S603", "S607", "PLR2004", "INP001"]
".ai-rulez/hermes/index.py" = ["INP001"]
".hermes/plugins/homebrew-news/__init__.py" = ["N999"]

[tool.mypy]
strict = true
python_version = "3.14"
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
