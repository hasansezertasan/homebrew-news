name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the uv version from mise
        id: uv-version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("mise.toml", "rb") as config:
              print(f"version={tomllib.load(config)['tools']['uv']}")
          PY
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true
          python-version: '3.14'
      - run: make check
